x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: anpr-gate:prod
  restart: unless-stopped
  env_file: ../.env.production
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-database-env: &database-env
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: anpr_gate
  DATABASE_USER: anpr_gate
  DATABASE_PASSWORD_FILE: /run/secrets/database_password
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password, database_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-anpr-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr_gate -d anpr_gate"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: 0.60
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    cpus: 0.15
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  web:
    <<: *app
    networks: [backend, edge, lan]
    command: ["python", "-m", "app.web"]
    environment:
      <<: *database-env
      LOCAL_SPOOL_ROOT: /spool
      ARCHIVE_ROOT: /archive
      ENTRY_GATE_DRIVER: ${ENTRY_GATE_DRIVER:-disabled}
      ENTRY_GATE_URL: ${ENTRY_GATE_URL:-}
      ENTRY_GATE_TOKEN_FILE: /run/secrets/entry_gate_token
      EXIT_GATE_DRIVER: ${EXIT_GATE_DRIVER:-disabled}
      EXIT_GATE_URL: ${EXIT_GATE_URL:-}
      EXIT_GATE_TOKEN_FILE: /run/secrets/exit_gate_token
    secrets: [database_password, entry_gate_token, exit_gate_token]
    volumes:
      - /srv/anpr/spool:/spool:ro
      - /mnt/anpr-archive:/archive:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 640m
    cpus: 0.35

  worker-entry:
    <<: *app
    networks: [backend, lan]
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *database-env
      WORKER_ID: entry-worker
      CAMERA_ID: entry
      CAMERA_NAME: Giriş Kamerası
      CAMERA_DIRECTION: entry
      CAMERA_HOST: ${ENTRY_CAMERA_HOST}
      CAMERA_USERNAME: ${ENTRY_CAMERA_USERNAME:-admin}
      CAMERA_PASSWORD_FILE: /run/secrets/entry_camera_password
      CAMERA_RTSP_PATH: ${ENTRY_CAMERA_RTSP_PATH:-Streaming/Channels/102}
      GATE_ID: entry
      GATE_DRIVER: ${ENTRY_GATE_DRIVER:-disabled}
      GATE_URL: ${ENTRY_GATE_URL:-}
      GATE_TOKEN_FILE: /run/secrets/entry_gate_token
      WORKER_STATE_PATH: /state/worker.sqlite3
      LOCAL_SPOOL_ROOT: /spool
      SPOOL_LIMIT_BYTES: "21474836480"
    secrets: [database_password, entry_camera_password, entry_gate_token]
    volumes:
      - /srv/anpr/spool:/spool
      - /srv/anpr/state/entry:/state
    mem_limit: 2048m
    cpus: 1.25

  worker-exit:
    <<: *app
    networks: [backend, lan]
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *database-env
      WORKER_ID: exit-worker
      CAMERA_ID: exit
      CAMERA_NAME: Çıkış Kamerası
      CAMERA_DIRECTION: exit
      CAMERA_HOST: ${EXIT_CAMERA_HOST}
      CAMERA_USERNAME: ${EXIT_CAMERA_USERNAME:-admin}
      CAMERA_PASSWORD_FILE: /run/secrets/exit_camera_password
      CAMERA_RTSP_PATH: ${EXIT_CAMERA_RTSP_PATH:-Streaming/Channels/102}
      GATE_ID: exit
      GATE_DRIVER: ${EXIT_GATE_DRIVER:-disabled}
      GATE_URL: ${EXIT_GATE_URL:-}
      GATE_TOKEN_FILE: /run/secrets/exit_gate_token
      WORKER_STATE_PATH: /state/worker.sqlite3
      LOCAL_SPOOL_ROOT: /spool
      SPOOL_LIMIT_BYTES: "21474836480"
    secrets: [database_password, exit_camera_password, exit_gate_token]
    volumes:
      - /srv/anpr/spool:/spool
      - /srv/anpr/state/exit:/state
    mem_limit: 2048m
    cpus: 1.25

  archive-sync:
    <<: *app
    command: ["python", "-m", "app.archive"]
    environment:
      <<: *database-env
      LOCAL_SPOOL_ROOT: /spool
      ARCHIVE_ROOT: /archive
      SNAPSHOT_RETENTION_DAYS: "60"
    secrets: [database_password]
    volumes:
      - /srv/anpr/spool:/spool
      - /mnt/anpr-archive:/archive
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 384m
    cpus: 0.25

  restore-test:
    <<: *app
    profiles: [maintenance]
    command: ["sh", "/app/scripts/restore-test.sh"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      ARCHIVE_ROOT: /archive
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    volumes:
      - /mnt/anpr-archive:/archive:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    secrets:
      - source: cloudflare_credentials
        target: cloudflare_credentials.json
    networks: [edge]
    depends_on:
      web: {condition: service_started}
    mem_limit: 128m
    cpus: 0.10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  backend:
    internal: true
  edge:
  lan:

volumes:
  postgres_data:

secrets:
  cloudflare_credentials: {file: ./cloudflared/credentials.json}
  postgres_admin_password: {file: ../secrets/postgres_admin_password}
  database_password: {file: ../secrets/database_password}
  entry_camera_password: {file: ../secrets/entry_camera_password}
  exit_camera_password: {file: ../secrets/exit_camera_password}
  entry_gate_token: {file: ../secrets/entry_gate_token}
  exit_gate_token: {file: ../secrets/exit_gate_token}
