{% extends "base.html" %}{% block title %}Access List · ANPR Gate{% endblock %}
{% block content %}
<header class="page-header"><div><span class="eyebrow">GİRİŞ + ÇIKIŞ</span><h1>Access list</h1></div></header>
{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
<section class="split access-layout"><article class="panel"><h2>Yeni plaka</h2><form method="post" action="/access-list" class="stack-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Plaka<input name="plate" required placeholder="34ABC123"></label><label>Sahip / açıklama<input name="owner_label" placeholder="Araç veya kişi"></label><label>Not<textarea name="note" rows="3"></textarea></label><button class="primary" type="submit">Listeye ekle</button></form></article>
<article class="panel"><form method="get" class="search"><input name="q" value="{{ q }}" placeholder="Plaka veya sahip ara"><button class="button">Ara</button></form><div class="entry-list">
{% for entry in entries %}<form method="post" action="/access-list/{{ entry.id }}" class="entry-row"><input type="hidden" name="csrf" value="{{ csrf }}"><input name="plate" value="{{ entry.plate }}" required><input name="owner_label" value="{{ entry.owner_label }}" placeholder="Sahip"><input name="note" value="{{ entry.note }}" placeholder="Not"><label class="switch"><input type="checkbox" name="is_active" {% if entry.is_active %}checked{% endif %}><span>Aktif</span></label><button class="button">Kaydet</button></form>{% else %}<div class="empty">Kayıt yok.</div>{% endfor %}
</div></article></section>
{% endblock %}
