<!doctype html>
<html lang="tr"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ANPR Gate · Giriş</title><link rel="stylesheet" href="/static/app.css">
</head><body class="login-page">
  <form method="post" action="/login" class="login-card">
    <div class="brand login-brand"><span class="brand-mark"></span><span>ANPR Gate</span></div>
    <h1>Yönetim paneli</h1><p>Devam etmek için yönetici hesabınızla giriş yapın.</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <label>Kullanıcı adı<input name="username" autocomplete="username" required autofocus></label>
    <label>Parola<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary wide" type="submit">Giriş yap</button>
  </form>
</body></html>
